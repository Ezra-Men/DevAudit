name: DevAudit CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Django Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migrations
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key
          DEBUG: "True"
        run: |
          python manage.py migrate

      - name: Run Test Suite
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-do
          DEBUG: "True"
          GEMINI_API_KEY: AIzaSyDummyKeyForMockedTestSuiteRunningInCI99
          GITHUB_TOKEN: ghp_dummyTokenForGitHubActionsTestingEnvironment
        run: |
          python manage.py test core --verbosity=2